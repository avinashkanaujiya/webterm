<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/xterm.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1e1e1e; }
  #term { height: 100%; padding: 6px 8px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="term"></div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/addon-clipboard.js"></script>
<script src="/addon-web-links.js"></script>
<script src="/addon-unicode11.js"></script>
<script src="/addon-webgl.js"></script>
<script src="/addon-canvas.js"></script>
<script src="/addon-image.js"></script>
<script src="/addon-search.js"></script>
<script src="/addon-unicode-graphemes.js"></script>
<script>
'use strict';
// Rendering config mirrors ttyd's client exactly (app.tsx): WebGL renderer
// with canvas fallback, Unicode 11 width rules, fontSize 13, and ttyd's exact
// font stack — font family/size determine cell metrics and box-drawing stroke
// alignment, so deviating from ttyd's values misaligns borders by a column.
//
// Preview-first replay: on refresh the server sends the newest (self-contained)
// bytes of the session ring first — the visible terminal paints the CURRENT
// screen immediately, so the user can act while history still streams. Then
// `fill` carries the full ring in order into a hidden terminal (same emulator,
// same options), and at `live` that hidden terminal replaces the preview one
// wholesale: parser state, buffers and all — the exact end state with full
// scrollback, ready for live bytes.
const container = document.getElementById('term');
const KEY = 'webterm.session';
let sid = localStorage.getItem(KEY) || ''; // persisted session id -> re-attach
let ws = null;
let dead = false;   // shell exited — stop reconnecting until reload
let replaying = false;
let current = null;    // { term, fit } — the live visible terminal
let scratch = null;    // { term, fit, search } — hidden terminal rebuilding full history
let pendingWrites = 0; // fill bytes still being parsed by the hidden terminal
let fillDone = false;  // live marker seen — swap once the hidden terminal is done
let swapPending = false; // live seen, swap not yet executed
let postLive = [];     // frames that arrived after live — flushed post-swap
let lastQuery = '';

function termOptions() {
  return {
    cursorBlink: true,
    fontSize: 13,
    fontFamily: 'Consolas,Liberation Mono,Menlo,Courier,monospace',
    scrollback: 50000,
    unicodeVersion: '11',
    allowProposedApi: true, // Unicode11Addon uses a proposed API (term.unicode)
    theme: { background: '#1e1e1e' },
  };
}

// ttyd's renderer chain: WebGL -> canvas -> dom. Returns the loaded renderer
// addon so the swap can dispose it before term.dispose() (the WebGL addon's
// own dispose throws in xterm 5.5 — see maybeSwap).
function enableRenderer(term) {
  try {
    const webgl = new (window.WebglAddon.WebglAddon)();
    webgl.onContextLoss(() => webgl.dispose());
    term.loadAddon(webgl);
    return webgl;
  } catch (e) { /* fall through */ }
  try {
    const canvas = new (window.CanvasAddon.CanvasAddon)();
    term.loadAddon(canvas);
    return canvas;
  } catch (e2) { /* keep DOM renderer */ }
  return null;
}

// Build a fully-wired terminal. openNow=false creates the hidden rebuild
// terminal: no DOM yet, but the same addons (image addon must be loaded
// BEFORE the fill stream is parsed — sixel cells depend on it).
function makeTerminal(openNow) {
  const term = new Terminal(termOptions());
  const fit = new (window.FitAddon.FitAddon)();
  term.loadAddon(fit);
  term.loadAddon(new (window.ClipboardAddon.ClipboardAddon)());
  term.loadAddon(new (window.WebLinksAddon.WebLinksAddon)());
  term.loadAddon(new (window.Unicode11Addon.Unicode11Addon)());
  term.loadAddon(new (window.UnicodeGraphemesAddon.UnicodeGraphemesAddon)());
  term.loadAddon(new (window.ImageAddon.ImageAddon)()); // sixel images
  const search = new (window.SearchAddon.SearchAddon)();
  term.loadAddon(search);
  // graphemes supersets unicode 11 width rules (emoji/ZWI correctness);
  // the addon registers its version as '15-graphemes'
  term.unicode.activeVersion = '15-graphemes';
  // Ctrl+Shift+F: find (prompt + next match); Ctrl+=/Ctrl+- font zoom
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== 'keydown') return true; // handler fires on keyup too
    if (e.ctrlKey && e.shiftKey && !e.altKey && e.key === 'F') {
      e.preventDefault();
      const q = window.prompt('Find:', lastQuery);
      if (q) {
        lastQuery = q;
        search.findNext(q, { incremental: false });
      }
      return false;
    }
    if (e.ctrlKey && !e.altKey && !e.metaKey) {
      if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        term.options.fontSize = Math.min(32, term.options.fontSize + 1);
        fit.fit();
        return false;
      }
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        term.options.fontSize = Math.max(6, term.options.fontSize - 1);
        fit.fit();
        return false;
      }
    }
    return true;
  });
  term.onData((d) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', data: d })); });
  term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols, rows })); });
  // copy selected text to the OS clipboard as soon as it's selected (ttyd-style)
  term.onSelectionChange(() => {
    const sel = term.getSelection();
    if (!sel) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(sel).catch(() => {});
    } else {
      document.execCommand('copy');
    }
  });
  if (openNow) {
    term.open(container);
    fit.fit();
    // ttyd loads the renderer after open; WebGL failures surface in the try/catch
    const renderer = enableRenderer(term);
    term.focus(); // cursor focused immediately, no click needed
    return { term, fit, search, renderer };
  }
  return { term, fit, search, renderer: null };
}

// route output to the visible terminal, or hold it while a swap is pending
function writeOut(bytes) {
  if (swapPending) postLive.push(bytes);
  else current.term.write(bytes);
}

// Drain frames that arrived after `live` while a swap was pending. Always
// reaches a terminal — the committed new one, or on swap failure the still-
// live old one — so no received frame is ever dropped; each write is guarded
// individually (a dead terminal logs and moves on rather than stalling).
function flushPostLive(target) {
  const queued = postLive;
  postLive = [];
  for (const bytes of queued) {
    try { target.write(bytes); } catch (e) { console.error('[webterm] postLive flush failed:', e); }
  }
}

// Replace the preview terminal with the hidden one that parsed the full ring.
// The whole Terminal instance swaps (parser state, buffers, modes travel with
// it) — swapping only the buffer lines would leave the preview parser's state
// active for subsequent live bytes. Runs at most once per attach.
function maybeSwap() {
  if (!scratch || !fillDone || pendingWrites !== 0) return;
  const s = scratch;
  scratch = null;
  swapPending = false;
  replaying = false;
  const old = current;
  let committed = false;
  try {
    // Staged, commit-point swap: fully prepare the new terminal (attach,
    // renderer, fit, focus), then atomically make it `current` — all in this
    // one synchronous block (no paint in between). Only after the commit is
    // the old terminal torn down. A failure before the commit leaves the old
    // terminal live and visible; a failure after can only touch the old one.
    s.term.open(container);
    s.term.scrollToBottom();
    const renderer = enableRenderer(s.term);
    s.fit.fit();
    s.term.focus();
    current = { term: s.term, fit: s.fit, search: s.search, renderer };
    window.term = s.term; // debugging hook now points at the live terminal
    committed = true;
    // cleanup of the old terminal — never touches the committed new one
    if (old.renderer) { try { old.renderer.dispose(); } catch (e) { /* defensive */ } }
    old.term.dispose(); // removes its element too; disposes addons
  } catch (err) {
    console.error('[webterm] swap failed:', err);
    if (!committed) {
      // preparation failed: the old terminal is still live and visible —
      // the failed scratch must not leave a second element in the container
      try { s.term.dispose(); } catch (e) { /* best-effort */ }
      flushPostLive(old.term); // parked frames go to the old terminal
    } else {
      // commit succeeded, old cleanup failed: the new terminal is live; make
      // sure a stale old element can't sit above it (its frames are drained
      // in the finally below)
      if (old.term.element) { try { old.term.element.remove(); } catch (e) {} }
    }
  } finally {
    // drain frames parked while the swap was pending — committed: to the new
    // terminal (even if old cleanup threw above); not committed: already
    // drained to the old terminal in the catch. Exactly one drain per path.
    if (committed) flushPostLive(current.term);
  }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'hello', id: sid, cols: current.term.cols, rows: current.term.rows }));
  };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'init') {
        sid = m.id;
        localStorage.setItem(KEY, sid);
        // a fresh attach: abandon any half-built fill from a previous attempt
        if (scratch) { scratch.term.dispose(); scratch = null; }
        pendingWrites = 0; fillDone = false; swapPending = false; postLive = [];
        current.term.reset();
        replaying = m.replay;
        current.term.focus();
      } else if (m.type === 'replay') {
        replaying = true;
      } else if (m.type === 'fill') {
        scratch = makeTerminal(false); // hidden; parses the full ring in order
      } else if (m.type === 'live') {
        fillDone = true;
        swapPending = !!scratch;
        maybeSwap();
        if (!swapPending) replaying = false;
      } else if (m.type === 'exit') {
        dead = true;
        writeOut('\r\n\x1b[31m[process exited — reload for a new shell]\x1b[0m\r\n');
      }
      return;
    }
    const bytes = new Uint8Array(e.data);
    if (scratch && !fillDone) {
      // fill phase: hidden terminal rebuilds the exact end state
      pendingWrites++;
      scratch.term.write(bytes, () => {
        if (--pendingWrites === 0) maybeSwap();
      });
    } else {
      writeOut(bytes);
    }
  };
  ws.onclose = () => {
    if (!dead) setTimeout(connect, 1000); // silent reconnect; session survives
  };
  ws.onerror = () => ws.close();
}

current = makeTerminal(true);
window.term = current.term; // handy for debugging, mirrors ttyd
window.addEventListener('resize', () => current.fit.fit());
window.addEventListener('beforeunload', () => { if (ws) ws.close(); });

connect();
</script>
</body>
</html>
