<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/xterm.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1e1e1e; }
  #term { height: 100%; padding: 6px 24px 6px 8px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="term"></div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/addon-clipboard.js"></script>
<script src="/addon-unicode11.js"></script>
<script src="/addon-webgl.js"></script>
<script src="/addon-canvas.js"></script>
<script>
'use strict';
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: 'Menlo, Consolas, "DejaVu Sans Mono", monospace',
  scrollback: 50000,
  unicodeVersion: '11',
  allowProposedApi: true, // Unicode11Addon uses a proposed API (term.unicode)
  theme: { background: '#1e1e1e' },
});
const fit = new (window.FitAddon.FitAddon)();
term.loadAddon(fit);
term.loadAddon(new (window.ClipboardAddon.ClipboardAddon)());
term.loadAddon(new (window.Unicode11Addon.Unicode11Addon)());
// canvas/WebGL renderer (like ttyd): pixel-exact cells fix right-edge and
// box-drawing misalignment of the default DOM renderer; fall back to canvas
// if WebGL is unavailable
function loadRenderer() {
  try {
    term.loadAddon(new (window.WebglAddon.WebglAddon)());
  } catch (e) {
    try {
      term.loadAddon(new (window.CanvasAddon.CanvasAddon)());
    } catch (e2) { /* keep DOM renderer */ }
  }
}
loadRenderer();
window.term = term; // handy for debugging, mirrors ttyd
term.open(document.getElementById('term'));
fit.fit();
term.focus(); // cursor focused immediately, no click needed

const KEY = 'webterm.session';
let sid = localStorage.getItem(KEY) || ''; // persisted session id -> re-attach
let ws = null;
let dead = false;   // shell exited — stop reconnecting until reload
let replaying = false;

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'hello', id: sid, cols: term.cols, rows: term.rows }));
  };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'init') {
        sid = m.id;
        localStorage.setItem(KEY, sid);
        term.reset();
        replaying = m.replay;
        term.focus();
      } else if (m.type === 'replay') {
        replaying = true;
      } else if (m.type === 'live') {
        replaying = false;
      } else if (m.type === 'exit') {
        dead = true;
        term.write('\r\n\x1b[31m[process exited — reload for a new shell]\x1b[0m\r\n');
      }
      return;
    }
    term.write(new Uint8Array(e.data));
  };
  ws.onclose = () => {
    if (!dead) setTimeout(connect, 1000); // silent reconnect; session survives
  };
  ws.onerror = () => ws.close();
}

term.onData((d) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', data: d })); });
term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols, rows })); });
// copy selected text to the OS clipboard as soon as it's selected (ttyd-style)
term.onSelectionChange(() => {
  const sel = term.getSelection();
  if (!sel) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(sel).catch(() => {});
  } else {
    document.execCommand('copy');
  }
});
window.addEventListener('resize', () => fit.fit());
window.addEventListener('beforeunload', () => { if (ws) ws.close(); });

connect();
</script>
</body>
</html>
