<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webterm</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  html, body { height: 100%; margin: 0; background: #1e1e1e; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 4px 10px;
         font: 12px/1.6 monospace; color: #999; background: #252526; }
  #bar button { font: inherit; background: #333; color: #ccc; border: 1px solid #555;
                border-radius: 3px; cursor: pointer; padding: 1px 10px; }
  #bar button:hover { background: #444; }
  #sid { color: #4ec9b0; }
  #status { color: #888; }
  #term { height: calc(100% - 29px); padding: 4px 10px; }
</style>
</head>
<body>
<div id="bar">
  <button id="new" title="kill this session's shell and start fresh">new session</button>
  <span id="sid"></span>
  <span id="status"></span>
</div>
<div id="term"></div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/addon-clipboard.js"></script>
<script>
'use strict';
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: 'Menlo, Consolas, "DejaVu Sans Mono", monospace',
  scrollback: 50000,
  theme: { background: '#1e1e1e' },
});
const fit = new FitAddon();
term.loadAddon(fit);
term.loadAddon(new ClipboardAddon());
term.open(document.getElementById('term'));
fit.fit();

const KEY = 'webterm.session';
const statusEl = document.getElementById('status');
const sidEl = document.getElementById('sid');
let sid = localStorage.getItem(KEY) || '';
let ws = null;
let dead = false;   // shell exited — stop reconnecting until reload
let paused = false;
let pending = 0;
const HIGH = 200, LOW = 50;

document.getElementById('new').onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'close' }));
  localStorage.removeItem(KEY);
  location.reload();
};

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    statusEl.textContent = 'connected';
    ws.send(JSON.stringify({ type: 'hello', id: sid, cols: term.cols, rows: term.rows }));
  };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'init') {
        sid = m.id;
        localStorage.setItem(KEY, sid);
        sidEl.textContent = sid.slice(0, 8);
        term.reset();
        statusEl.textContent = m.replay ? 'session restored' : 'new session';
      } else if (m.type === 'exit') {
        dead = true;
        statusEl.textContent = 'process exited — reload for a new shell';
        term.write('\r\n\x1b[31m[process exited]\x1b[0m\r\n');
      }
      return;
    }
    pending++;
    term.write(new Uint8Array(e.data), () => {
      pending--;
      if (paused && pending < LOW) {
        paused = false;
        if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'resume' }));
      }
    });
    if (!paused && pending > HIGH) {
      paused = true;
      ws.send(JSON.stringify({ type: 'pause' }));
    }
  };
  ws.onclose = () => {
    if (!dead) {
      statusEl.textContent = 'reconnecting\u2026';
      setTimeout(connect, 1000);
    }
  };
  ws.onerror = () => ws.close();
}

term.onData((d) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', data: d })); });
term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols, rows })); });
// copy selected text to the OS clipboard as soon as it's selected (ttyd-style)
term.onSelectionChange(() => {
  const sel = term.getSelection();
  if (!sel) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(sel).catch(() => {});
  } else {
    document.execCommand('copy');
  }
});
window.addEventListener('resize', () => fit.fit());
window.addEventListener('beforeunload', () => { if (ws) ws.close(); });

connect();
</script>
</body>
</html>
